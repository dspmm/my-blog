# P6Spy 全局 SQL 审计配置
module.log=com.p6spy.engine.logging.P6LogFactory,com.p6spy.engine.spy.P6SpyFactory
# 自定义防空行 Slf4JLogger 输出，与 Spring Boot 统一管理
appender=com.example.blog.config.CustomP6spyLogger
# 自定义高颜值格式化器类
logMessageFormat=com.example.blog.config.P6spySqlFormat
# 仅输出 statement 级真实业务 SQL
filter=true
# 自动剥离无参数的普通连接探测与事务控制
excludecategories=info,debug,result,resultset,batch,commit,rollback
# 时间格式
dateformat=yyyy-MM-dd HH:mm:ss.SSS
