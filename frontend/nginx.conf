server {
    listen 80;
    server_name localhost;

    # 爬虫识别：匹配搜索引擎、社交媒体 Bot 或人工调试参数 ?spider=1
    set $is_spider 0;
    if ($http_user_agent ~* "(googlebot|baiduspider|bingbot|sogou|bytespider|360spider|yandexbot|duckduckbot|twitterbot|facebookexternalhit|linkedinbot|telegrambot|slackbot)") {
        set $is_spider 1;
    }
    if ($arg_spider = "1") {
        set $is_spider 1;
    }

    # 搜索引擎站点地图 (Sitemap)
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 搜索引擎爬虫准则 (robots.txt)
    location = /robots.txt {
        proxy_pass http://backend:8080/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bing 站长平台权威所有权 XML 文件验证映射
    location = /BingSiteAuth.xml {
        root /usr/share/nginx/html;
        try_files /BingSiteAuth.xml =404;
    }

    # 针对文章详情页的动静分流：蜘蛛访问直出 HTML，人类访问载入 SPA
    location ~* ^/post/([0-9]+)$ {
        set $post_id $1;
        if ($is_spider = 1) {
            rewrite ^ /internal_spider_seo/$post_id last;
        }
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 内部专用爬虫代理端点 (外部无法直接访问 /internal_spider_seo/)
    location ~* ^/internal_spider_seo/([0-9]+)$ {
        internal;
        proxy_pass http://backend:8080/api/seo/post/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 默认静态前端单页应用
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 反向代理后端 Spring Boot API 接口，解决无法连接后端与跨域问题
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 反向代理 MinIO 对象存储图片，同源输出，彻底规避跨端口、跨域及防火墙拦截问题
    location /my-blog/ {
        proxy_pass http://minio:9000/my-blog/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_hide_header Strict-Transport-Security;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    }
}
